<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Харид — Instagram-магазины Таджикистана</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Golos+Text:wght@400;500;600;700;800&display=swap">
  <!-- ?v=2: старую иконку Angular браузеры закэшировали на год по прежнему адресу -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <!-- Тема до первой отрисовки, иначе тёмная тема мигнёт белым. Ключ и цвета — как в core/theme.service.ts -->
  <script>try{var t=JSON.parse(localStorage.getItem('harid.theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.querySelector('meta[name="theme-color"]').setAttribute('content','#0d1430')}catch(e){}</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
